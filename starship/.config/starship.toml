# Global Settings
scan_timeout = 100
command_timeout = 500
add_newline = false
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_seg1)\
$os\
$username\
[](bg:color_seg2 fg:color_seg1)\
$directory\
[](fg:color_seg2 bg:color_seg3)\
$git_branch\
$git_status\
[](fg:color_seg3 bg:color_seg4)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color_seg4 bg:color_bg3)\
$docker_context\
$conda\
$pixi\
[](fg:color_bg3 bg:color_bg1)\
$time\
[ ](fg:color_bg1)\
$line_break$character"""

palette = 'token_meridian_dark'

[palettes.token_meridian_dark]
color_fg0 = '#c9c0b1'    # fg, theme foreground
color_dark = '#1d1d1c'   # black, text on the bright blocks
color_bg1 = '#3c3b36'    # selection, dark block behind the time
color_bg3 = '#4d4231'    # search bg, dark block behind docker / conda

# Prompt blocks, left to right
color_seg1 = '#dd8384'   # red     os / username
color_seg2 = '#7cc1dc'   # blue    directory
color_seg3 = '#cf9c70'   # cyan    git
color_seg4 = '#8cbb62'   # green   languages
color_docker = '#7cc1dc' # blue    docker / conda text

# Prompt character
color_green = '#8cbb62'
color_red = '#dd8384'
color_purple = '#c69de8'

[os]
disabled = true
style = "bg:color_seg1 fg:color_dark"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:color_seg1 fg:color_dark"
style_root = "bg:color_seg1 fg:color_dark"
format = '[ $user ]($style)'

[directory]
style = "fg:color_dark bg:color_seg2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_seg3"
format = '[[ $symbol $branch ](fg:color_dark bg:color_seg3)]($style)'

[git_status]
style = "bg:color_seg3"
format = '[[($all_status$ahead_behind )](fg:color_dark bg:color_seg3)]($style)'

[nodejs]
symbol = ""
style = "bg:color_seg4"
format = '[[ $symbol( $version) ](fg:color_dark bg:color_seg4)]($style)'

[bun]
symbol = ""
style = "bg:color_seg4"
format = '[[ $symbol( $version) ](fg:color_dark bg:color_seg4)]($style)'

[c]
symbol = " "
style = "bg:color_seg4"
format = '[[ $symbol( $version) ](fg:color_dark bg:color_seg4)]($style)'

[cpp]
symbol = " "
style = "bg:color_seg4"
format = '[[ $symbol( $version) ](fg:color_dark bg:color_seg4)]($style)'

[rust]
symbol = ""
style = "bg:color_seg4"
format = '[[ $symbol( $version) ](fg:color_dark bg:color_seg4)]($style)'

[golang]
symbol = ""
style = "bg:color_seg4"
format = '[[ $symbol( $version) ](fg:color_dark bg:color_seg4)]($style)'

[php]
symbol = ""
style = "bg:color_seg4"
format = '[[ $symbol( $version) ](fg:color_dark bg:color_seg4)]($style)'

[java]
symbol = ""
style = "bg:color_seg4"
format = '[[ $symbol( $version) ](fg:color_dark bg:color_seg4)]($style)'

[kotlin]
symbol = ""
style = "bg:color_seg4"
format = '[[ $symbol( $version) ](fg:color_dark bg:color_seg4)]($style)'

[haskell]
symbol = ""
style = "bg:color_seg4"
format = '[[ $symbol( $version) ](fg:color_dark bg:color_seg4)]($style)'

[python]
symbol = ""
style = "bg:color_seg4"
format = '[[ $symbol( $version) ](fg:color_dark bg:color_seg4)]($style)'

[docker_context]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:color_docker bg:color_bg3)]($style)'

[conda]
style = "bg:color_bg3"
format = '[[ $symbol( $environment) ](fg:color_docker bg:color_bg3)]($style)'

[pixi]
style = "bg:color_bg3"
format = '[[ $symbol( $version)( $environment) ](fg:color_fg0 bg:color_bg3)]($style)'

[time]
disabled = false
use_12hr = true
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg0 bg:color_bg1)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_green)'
error_symbol = '[](bold fg:color_red)'
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_visual_symbol = '[](bold fg:color_seg2)'
