# General
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on
setw -g mode-keys vi

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits and reload
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Seamless navigation
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Colors (token meridian dark)
%hidden BG="#181817"
%hidden BG_ALT="#272724"
%hidden FG="#b8aea1"
%hidden MUTED="#a69c91"
%hidden BORDER="#91887d"
%hidden ACCENT="#e89a49"
%hidden HIGHLIGHT="#7cc1dc"

# Status bar
set -g status-position bottom
set -g status-style "bg=$BG,fg=$FG"
set -g status-left "#[bg=$ACCENT,fg=$BG,bold] #S #[default] "
set -g status-right "#[fg=$MUTED]%H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=$BG_ALT,fg=$HIGHLIGHT,bold] #I:#W "
set -g pane-border-style "fg=$BORDER"
set -g pane-active-border-style "fg=$ACCENT"
set -g message-style "bg=$BG_ALT,fg=$FG"
