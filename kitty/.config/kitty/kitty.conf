# Shell
shell fish

# Font
font_family JetBrainsMono Nerd Font
font_size 12.0
disable_ligatures always

# Window appearance and size
background_opacity 1
window_padding_width 7
cursor_shape beam
remember_window_size no
initial_window_width 135c
initial_window_height 35c

# Scrollback
scrollback_lines 10000
scrollback_pager_history_size 10

# Tab bar
tab_bar_style powerline
tab_powerline_style angled
tab_bar_min_tabs 1

# Layouts
enabled_layouts splits,stack

# Mouse and clipboard
copy_on_select clipboard
mouse_hide_wait -1

# Keybindings
# Prefix is ctrl+g: press it, release, then press one plain key

# Move focus between splits
map ctrl+g>h neighboring_window left
map ctrl+g>j neighboring_window down
map ctrl+g>k neighboring_window up
map ctrl+g>l neighboring_window right

# Create splits
map ctrl+g>v launch --location=vsplit --cwd=current
map ctrl+g>s launch --location=hsplit --cwd=current

# Move the current split's position
map ctrl+g>shift+h move_window left
map ctrl+g>shift+j move_window down
map ctrl+g>shift+k move_window up
map ctrl+g>shift+l move_window right

# Zoom the current split to fill the tab (press again to restore)
map ctrl+g>z toggle_layout stack

# Resize mode: use h/j/k/l or arrows, press enter to finish
map ctrl+g>r start_resizing_window

# Close the current split
map ctrl+g>q close_window

# Theme
# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME
