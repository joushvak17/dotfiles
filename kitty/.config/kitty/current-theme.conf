## license: MIT
## upstream: https://github.com/jacoborus/tender.vim (estilos/palettes/tender.yml, estilos/terminal.yml)

#: The basic colors

foreground                      #eeeeee
background                      #282828
selection_foreground            #eeeeee
selection_background            #293b44

#: Cursor colors

cursor                          #73cef4
cursor_text_color               #282828

#: URL underline color when hovering with mouse

url_color                       #73cef4

#: Tab bar colors (not in upstream; picked from the same palette)

active_tab_foreground           #c9d05c
active_tab_background           #282828
inactive_tab_foreground         #999999
inactive_tab_background         #1d1d1d
tab_bar_background              #1d1d1d

#: The basic 16 colors
#: Taken from upstream's estilos/terminal.yml. Upstream has no separate bright
#: set (brights repeat the normals), and it maps black to the background and
#: bright black to an even darker shade, which makes that text invisible; those
#: two use the palette's greys instead. Tender has no purple: magenta is its
#: sand yellow, as upstream.

#: black
color0  #444444
color8  #666666

#: red
color1  #f43753
color9  #f43753

#: green
color2  #c9d05c
color10 #c9d05c

#: yellow
color3  #ffc24b
color11 #ffc24b

#: blue
color4  #b3deef
color12 #b3deef

#: magenta
color5  #d3b987
color13 #d3b987

#: cyan
color6  #73cef4
color14 #73cef4

#: white
color7  #eeeeee
color15 #ffffff
